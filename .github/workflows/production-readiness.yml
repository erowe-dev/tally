name: Production Readiness

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: Angular app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tally
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tally/package-lock.json

      - name: Install
        run: npm ci

      - name: Check program ids
        run: npm run check:program-ids

      - name: Production dependency audit baseline
        run: npm run audit:prod

      - name: Test
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build
        run: npm run build

      - name: Build PWA
        run: npm run build:pwa

      - name: Production preflight
        run: npm run preflight:prod

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Production preflight
        run: npm run preflight:prod

  production-smoke:
    name: Production smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: tally
    env:
      TALLY_AUTH_EMAIL: ${{ secrets.TALLY_AUTH_EMAIL }}
      TALLY_AUTH_TOKEN: ${{ secrets.TALLY_AUTH_TOKEN }}
      TALLY_REQUIRE_AUTH_SMOKE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tally/package-lock.json

      - name: Install
        run: npm ci

      - name: Run release smoke
        run: npm run smoke:release
